
version: "0.1"

defaults:
  file_format: csv
  allow_extra_columns: true
  missing_required_columns: error
  missing_required_values: error
  invalid_data_types: error
  empty_optional_columns: allow
  empty_optional_values: allow

# Standard EPTQ field data types.
# These types are shared across all factories.

field_types:
  string:
    - factory_id
    - machine_id
    - product_id
    - product_revision
    - production_order_id
    - bom_id
    - component_id
    - ecn_id
    - approval_status
    - quality_event_id
    - finished_lot_id
    - downtime_event_id
    - source_record_id

  integer:
    - output_count
    - sample_size
    - defect_count
    - planned_quantity
    - actual_quantity
    - good_quantity
    - rejected_quantity
    - bom_line_number

  float:
    - cycle_time_ms
    - bearing_temp_c
    - vibration_mm_s
    - hydraulic_pressure_bar
    - duration_minutes
    - quantity
    - benchmark_efficiency_nm3_per_kwh
    - rated_power_kw

  boolean:
    - defect_flag

  datetime:
    - event_timestamp
    - start_time
    - end_time
    - effective_date
    - request_date
    - inspection_time
    - design_release_date

# Fields generated by the reusable pipeline.
generated_fields:
  - source_record_id

datasets:

  machine_logs:
    entity: machine_event
    required_fields:
      - machine_id
      - event_timestamp

    optional_fields:
      - production_order_id
      - product_id
      - product_revision
      - machine_state
      - cycle_time_ms
      - output_count
      - defect_flag
      - bearing_temp_c
      - vibration_mm_s
      - hydraulic_pressure_bar

  production_orders:
    entity: production_order
    required_fields:
      - production_order_id
      - product_id

    # Scenario 6: Detect duplicate production order IDs.
    unique_fields:
      - production_order_id

    optional_fields:
      - product_revision
      - bom_id
      - machine_id
      - start_time
      - end_time
      - planned_quantity
      - actual_quantity
      - good_quantity
      - rejected_quantity
      - order_status
      - operator_id

  downtime_events:
    entity: downtime_event
    required_fields:
      - downtime_event_id
      - machine_id

    optional_fields:
      - production_order_id
      - start_time
      - end_time
      - downtime_reason
      - duration_minutes
      - capture_method

  product_metadata:
    entity: product
    required_fields:
      - product_id

    optional_fields:
      - product_name
      - product_family
      - unit_of_measure
      - product_revision
      - bom_id
      - design_release_date
      - cad_file_reference

  bom:
    entity: bom_component
    required_fields:
      - product_id
      - component_id

    optional_fields:
      - bom_id
      - product_revision
      - component_description
      - component_revision
      - quantity
      - unit_of_measure
      - bom_line_number

  engineering_changes:
    entity: engineering_change
    required_fields:
      - ecn_id
      - product_id
      - approval_status

    # Scenario 6: Allow only standardized approval statuses.
    allowed_values:
      approval_status:
        - APPROVED
        - PENDING
        - REJECTED

    optional_fields:
      - revision_from
      - revision_to
      - effective_date
      - request_date
      - component_id
      - change_type
      - change_title
      - change_description

  quality_events:
    entity: quality_event
    required_fields:
      - quality_event_id
      - production_order_id
      - product_id

    # Scenario 6: Detect duplicate quality event IDs.
    unique_fields:
      - quality_event_id

    optional_fields:
      - finished_lot_id
      - product_revision
      - machine_id
      - inspection_time
      - sample_size
      - defect_count
      - disposition
      - defect_category
      - ncr_id

  electrolyser_reference:
    entity: electrolyser_reference
    required_fields:
      - product_id
      - benchmark_efficiency_nm3_per_kwh
      - rated_power_kw

    optional: true

future_dataset_policy:
  allow_new_datasets: true
  require_factory_configuration: true
  require_mapping_configuration: true
  require_validation_rules: true
  unknown_dataset_behavior: reject_with_clear_error

# entity: Connects a dataset to its standard EPTQ entity.
# required_fields: Fields that must exist in the standardized dataset.
# optional_fields: Fields that factories may provide when available.
# missing_required_columns: Checks whether required columns exist.
# missing_required_values: Checks whether required values are empty.
# empty_optional_values: Allows optional fields to contain empty values.
# allow_extra_columns: Controls whether unexpected fields are accepted.
# optional: true allows the complete dataset to be absent.
