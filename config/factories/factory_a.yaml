
#This tells our system where Factory A's datasets are located and what formats they use.
factory:
  factory_id: "FACTORY_A"
  factory_name: "Factory A"
  description: "Original MES-PLM manufacturing POC"
  
mapping_config: "config/mappings/factory_a_mapping.yaml"

source:
  root_path: "data/raw"
  file_format: "csv"

output:
  landing_path: "data/landing"
  error_path: "data/errors"
  standardized_path: "data/standardized"


datasets:

  machine_logs:
    source_folder: "mes"
    source_file: "machine_logs.csv"
    required_columns:
      - timestamp
      - production_order_id
      - machine_id
      - status
      - cycle_time_ms
      - output_count
      - rejected_quantity
      - defect_flag

  production_orders:
    source_folder: "mes"
    source_file: "production_orders.csv"
    required_columns:
      - order_id
      - product_id
      - machine_id
      - start_time
      - end_time
      - planned_qty
      - actual_qty

  downtime_events:
    source_folder: "mes"
    source_file: "downtime_events.csv"
    required_columns:
      - event_id
      - production_order_id
      - machine_id
      - start_time
      - end_time
      - reason_code

  bom:
    source_folder: "plm"
    source_file: "bom.csv"
    required_columns:
      - product_id
      - component_id
      - quantity
      - component_version

  product_metadata:
    source_folder: "plm"
    source_file: "product_metadata.csv"
    required_columns:
      - product_id
      - product_name
      - design_release_date
      - CAD_file_ref

  engineering_changes:
    source_folder: "plm"
    source_file: "ecn_requests.csv"
    required_columns:
      - change_id
      - product_id
      - change_type
      - request_date
      - approved_flag

  electrolyser_reference:
    source_folder: ""
    source_file: "electrolyser_reference.csv"
    required_columns:
      - product_id
      - benchmark_efficiency_nm3_per_kwh
      - rated_power_kw
    optional: true
    purpose: "Product benchmark reference data"
