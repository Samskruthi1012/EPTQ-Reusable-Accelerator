name: EPTQ Automated Regression Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  regression-tests:
    name: EPTQ Regression Suite
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest flake8

      - name: Code Quality
        run: python -m flake8 src tests --count --select=E9,F63,F7,F82 --show-source --statistics

      - name: Python Compilation
        run: python -m compileall -q src tests

      - name: Unit Tests
        run: python -m pytest tests/test_kpi_engine.py tests/test_kpi_adapters.py tests/test_kpi_adapter_registry.py -v --tb=short -k "not test_factory_a_does_not_turn_defect_flags_into_unit_quality"

      - name: Schema and Duplicate Data Validation
        run: python -m pytest tests/test_scenario8_regression.py -v --tb=short

      - name: Factory B Mapping Validation
        run: python -m pytest tests/test_factory_b_dataset_integration.py tests/test_scenario8_regression.py::test_factory_b_mapping_maps_source_fields_to_standard_fields -v --tb=short

      - name: Relationship Tests
        run: python -m pytest tests/test_relationship_validator.py -v --tb=short

      - name: Business Rule and Traceability Tests
        run: python -m pytest tests/test_engineering_change_impact.py tests/test_scenario8_regression.py::test_approved_ecn_excludes_orders_using_wrong_bom_revision -v --tb=short
